name: Prepare release

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag and
  regenerates the auto-generated wiki/ so both ship together in the SAME
  commit — CI runs once. After merge, publish-release.yml takes over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v2.5.0, v2.5.0-beta.1)'
        required: true
        type: string

# `contents: write` — push the release-bump branch (GITHUB_TOKEN)
# `id-token: write` — Octopass OIDC for PR creation (create-pr action)
permissions:
  contents: write
  id-token: write

jobs:
  # Validate the tag and resolve canonical version metadata (same reusable
  # workflow the shared create-release-pr.yml used internally).
  metadata:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/version-metadata.yml@master
    with:
      team: extensions
      tag: ${{ inputs.tag }}

  # Inlines the shared create-release-pr.yml flow, but wedges the wiki
  # regeneration BETWEEN "update-changelog" and "commit" so the wiki lands in
  # the SAME initial commit as the CHANGELOG bump. This way the PR opens with
  # both changes already present, and CI runs exactly once (on the
  # pull_request:opened event fired by the Octopass-authenticated create-pr
  # action) instead of twice (opened → CI → wiki push → CI again).
  #
  # Why inline instead of the shared reusable workflow?
  #   The shared create-release-pr.yml does checkout → update-changelog →
  #   create branch + commit + push → open PR all in one job, with no hook to
  #   inject a step between changelog and commit. Reusable workflows can't have
  #   steps injected, so we replicate its logic here, calling the same composite
  #   actions (update-changelog, create-pr) so the behavior is identical — only
  #   the wiki build is newly inserted.
  create-release-pr:
    needs: [metadata]
    runs-on: team-extensions
    permissions:
      # `contents: write` — push the release branch (GITHUB_TOKEN).
      #   This push does NOT trigger CI: GitHub suppresses events from
      #   GITHUB_TOKEN. CI is triggered by the PR opening (next step).
      # `id-token: write` — Octopass OIDC (the create-pr action exchanges
      #   the id-token for a short-lived App installation token to open the PR).
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update changelog
        # Rolls [Unreleased] → dated [x.y.z] section and extracts release notes.
        # Same composite action the shared create-release-pr.yml uses.
        id: changelog
        uses: AdGuardSoftwareLimited/actions/actions/update-changelog@master
        with:
          changelog-path: CHANGELOG.md
          new-version: ${{ needs.metadata.outputs.raw-version }}

      # Build the auto-generated wiki/ from JSDoc so it ships in the same
      # commit as the CHANGELOG bump.
      #
      # Best-effort: the wiki build runs against the shared remote BuildKit
      # instance, which can be transiently unreachable (buildx "[internal]
      # waiting for connection" → "context deadline exceeded") or can fail
      # because scripts/compatibility-table.json drifted from upstream uBO/ABP
      # (see scripts/check-sources-updates.js).  `continue-on-error: true` means
      # a transient build failure leaves the release PR fully mergeable without
      # the wiki — the wiki is simply retried the next time a release is
      # prepared.
      - name: Build wiki
        id: build-wiki
        continue-on-error: true
        run: >-
          DOCKER_BUILDKIT=1 docker build --progress plain
          --target wiki-output --output ./wiki-out
          --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}
          .

      # Only append when the wiki was actually built; a transient build failure
      # (steps.build-wiki.outcome != 'success') is skipped so we don't try to
      # mv a non-existent wiki-out/ directory. The PR still opens with just the
      # CHANGELOG bump.
      - name: Append regenerated wiki
        if: steps.build-wiki.outcome == 'success'
        run: |
          rm -rf wiki
          mv wiki-out/wiki wiki
          rm -rf wiki-out

      - name: Create branch and commit
        id: branch
        shell: bash
        env:
          NEW_VERSION: ${{ needs.metadata.outputs.raw-version }}
        run: |
          set -euo pipefail

          BRANCH_NAME="release-bump/v${NEW_VERSION}"

          git config user.name "adguard-octopass[bot]"
          git config user.email "285975488+adguard-octopass[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          # CHANGELOG.md was modified by the update-changelog action above.
          git add CHANGELOG.md
          # wiki/ was replaced by the build step above (if it succeeded).
          # If the build failed/skipped, wiki/ is unchanged and this is a no-op.
          git add wiki || true
          git commit -m "Release v${NEW_VERSION}"
          # Delete stale remote branch if a previous run left one behind, then
          # push the fresh branch. This push uses GITHUB_TOKEN (which does NOT
          # trigger CI — that's intentional; CI is triggered by the PR opening
          # in the next step).
          git push origin ":$BRANCH_NAME" || true
          git push origin "$BRANCH_NAME"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      # Opens the PR with an Octopass App installation token (NOT GITHUB_TOKEN).
      # Pushes/PR-creates made with GITHUB_TOKEN never trigger workflow runs, so
      # the PR must be opened with a real App token to fire pull_request:opened
      # → CI runs once on a branch that already has both CHANGELOG and wiki.
      # Same composite action the shared create-release-pr.yml uses.
      - name: Create pull request
        uses: AdGuardSoftwareLimited/actions/actions/create-pr@master
        with:
          title: 'Release v${{ needs.metadata.outputs.raw-version }}'
          body: ${{ steps.changelog.outputs.release_notes }}
          head: ${{ steps.branch.outputs.branch }}
          base: ${{ github.ref_name }}
