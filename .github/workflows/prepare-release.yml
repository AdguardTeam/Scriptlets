name: Prepare release

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag and
  regenerates the auto-generated wiki/ so both ship together in the PR.
  After merge, publish-release.yml takes over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v2.5.0, v2.5.0-beta.1)'
        required: true
        type: string

# `contents: write` — push the release-bump branch (+ the wiki commit)
# `id-token: write` — Octopass OIDC for PR creation
permissions:
  contents: write
  id-token: write

jobs:
  # Opens the release PR: branches off master, finalizes CHANGELOG.md into a
  # dated [x.y.z] section, commits, and opens a PR on branch
  # `release-bump/v<x.y.z>` (the shared workflow names it deterministically).
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      tag: ${{ inputs.tag }}
      team: extensions

  # Regenerate the auto-generated wiki/ from JSDoc and append it to the release
  # PR's branch so the wiki update is reviewed and merged TOGETHER with the
  # release — instead of being committed directly to master post-publish.
  #
  # The shared create-release-pr workflow does not expose its branch name, but
  # names branches deterministically as `release-bump/v<version>` (version = the
  # `tag` input, which already carries the `v` prefix), so `release-bump/${{ inputs.tag }}`
  # matches the branch it just pushed.
  #
  # This job appends the regenerated wiki/ to the release PR's branch so the
  # wiki update is reviewed and merged TOGETHER with the release.
  #
  # Only the wiki BUILD is best-effort: the "Build wiki" step runs against the
  # shared remote BuildKit instance, which can be transiently unreachable
  # (buildx "[internal] waiting for connection" → "context deadline exceeded")
  # or can fail because scripts/compatibility-table.json drifted from upstream
  # uBO/ABP (see scripts/check-sources-updates.js, which fetches live upstream
  # lists and throws on drift).  That step carries `continue-on-error: true`, so
  # a transient build failure leaves the release PR fully mergeable without the
  # wiki — the wiki is simply retried the next time a release is prepared.
  #
  # The commit/push step, however, is NOT best-effort: it only runs when the
  # build actually succeeded (steps.build-wiki.outcome == 'success'), and a
  # failure there (e.g. unable to push to the release branch) is a real error
  # that surfaces as a red job rather than being silently swallowed — because
  # the wiki WAS built but never reached the PR.  prepare-release.yml is a
  # workflow_dispatch-only workflow and is NOT a required check on the release
  # PR, so even a red run here never blocks the merge.
  update-wiki:
    needs: create-release-pr
    runs-on: team-extensions
    permissions:
      contents: write
    steps:
      - name: Checkout release-bump branch
        uses: actions/checkout@v5
        with:
          ref: release-bump/${{ inputs.tag }}
          fetch-depth: 0

      - name: Build wiki
        id: build-wiki
        continue-on-error: true
        run: >-
          DOCKER_BUILDKIT=1 docker build --progress plain
          --target wiki-output --output ./wiki-out
          --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}
          .

      # Only append when the wiki was actually built; a transient build
      # failure (steps.build-wiki.outcome != 'success') is skipped so we don't
      # try to mv a non-existent wiki-out/ directory.
      - name: Append regenerated wiki to the release PR
        if: steps.build-wiki.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf wiki
          mv wiki-out/wiki wiki
          rm -rf wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki
          # Only commit and push when the wiki actually changed; a no-op
          # rebuild (e.g. re-run of update-wiki) leaves nothing to push.
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "chore: regenerate wiki docs for release"
            git push origin "release-bump/${{ inputs.tag }}"
          fi
