name: Prepare release

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag (via the
  shared create-release-pr.yml reusable workflow), then regenerates the
  auto-generated wiki/ and appends it to the PR's branch so both are reviewed
  and merged together. After merge, publish-release.yml takes over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v2.5.0, v2.5.0-beta.1)'
        required: true
        type: string

# These workflow-level scopes are inherited only by the reusable
# `create-release-pr` job: `contents: write` lets it create the release branch
# and PR, and `id-token: write` lets the create-pr action inside it exchange
# the OIDC token for a short-lived App installation token. The `update-wiki`
# job declares its own scopes below.
permissions:
  contents: write
  id-token: write

jobs:
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      team: extensions
      tag: ${{ inputs.tag }}

  # Regenerate the auto-generated wiki/ from JSDoc and append it to the release
  # PR's branch after the PR is open, so the wiki update is reviewed and merged
  # TOGETHER with the release. This way released code changes and docs are
  # always in sync.
  update-wiki:
    needs: create-release-pr
    runs-on: team-extensions
    # `pull-requests: write` — post a comment on the release PR when the wiki
    #   build fails (update-wiki stays green; the comment is the notification)
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release-bump/${{ inputs.tag }}
          fetch-depth: 0

      # Build the wiki but do NOT block the release on failure: the job stays
      # green (continue-on-error). The build log is captured so the step below
      # can notify the release PR with the error excerpt.
      - name: Build wiki
        id: build-wiki
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          # BuildKit writes its progress and the final error to stderr, so
          # merge stderr into the pipe before tee; PIPESTATUS[0] stays the
          # exit status of docker itself.
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --target wiki-output --output ./wiki-out . 2>&1 \
            | tee "$RUNNER_TEMP/wiki-build.log"
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "${exit_code}" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/wiki-build.log" > "$RUNNER_TEMP/wiki-build-error.txt"
          fi
          exit "${exit_code}"

      # Only append when the wiki was actually built; a transient build failure
      # (steps.build-wiki.outcome != 'success') is skipped so we don't try to
      # mv a non-existent wiki-out/ directory. The PR still contains just the
      # CHANGELOG bump.
      - name: Append regenerated wiki
        if: steps.build-wiki.outcome == 'success'
        run: |
          rm -rf wiki
          mv wiki-out/wiki wiki
          rm -rf wiki-out

      # Commit and push the wiki to the release branch. protected-push:
      #   - no-ops (has_changes=false, exit 0) when the rebuild is a no-op;
      #   - resolves the remote branch head and pushes with --force-with-lease
      #     (refuses to clobber a concurrent push);
      #   - authenticates with an Octopass token instead of GITHUB_TOKEN.
      - name: Commit and push wiki
        if: steps.build-wiki.outcome == 'success'
        uses: AdGuardSoftwareLimited/actions/actions/protected-push@master
        with:
          # Required: protected-push forwards this to Octopass as the target
          # repository for the minted token. Without it, Octopass gets an
          # empty repository and rejects the request ("invalid token scope
          # request").
          repository: ${{ github.repository }}
          branch: release-bump/${{ inputs.tag }}
          commit-message: 'docs: regenerate wiki docs for release'
          files: wiki

      # The update-wiki job intentionally stays green when the wiki build fails
      # (see build-wiki's continue-on-error), so a silent failure would leave
      # the release PR without regenerated docs and nobody would notice. Post a
      # comment on the release PR with the captured error so a maintainer can
      # fix it (e.g. commit the needed wiki changes manually).
      - name: Comment on release PR about wiki build failure
        if: >-
          steps.build-wiki.outcome == 'failure' ||
          steps.build-wiki.outcome == 'cancelled'
        # Best-effort notification: update-wiki must stay green even if the
        # comment cannot be posted (e.g. transient API error). Such an error is
        # still surfaced on the run page, see the script below.
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          RELEASE_BRANCH: release-bump/${{ inputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const releaseBranch = process.env.RELEASE_BRANCH;
            const marker = '<!-- ext-scriptlets:wiki-build-failure -->';
            // Keep the comment well below GitHub's 65,536-character limit.
            const maxExcerptLength = 60000;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // The job stays green, so a failure that cannot be reported on the
            // PR must at least be visible on the run page.
            const reportFailure = async (message) => {
              core.error(message);
              await core.summary
                .addHeading('Wiki build failure notification failed', 2)
                .addRaw(`${message}\n\nFull log: ${runUrl}\n`)
                .write();
            };

            const errorMessage = (err) => String(err && err.message ? err.message : err);

            // The release PR is opened by the shared create-release-pr workflow
            // on the release-bump/<tag> branch; resolve its number by head ref.
            let number;
            try {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${releaseBranch}`,
              });
              if (pulls.length === 0) {
                await reportFailure(
                  `No open release PR found for branch ${releaseBranch}; ` +
                    'the wiki build failure is not reported on a PR.',
                );
                return;
              }
              number = pulls[0].number;
            } catch (err) {
              await reportFailure(
                `Could not look up the release PR for branch ${releaseBranch}: ` +
                  errorMessage(err),
              );
              return;
            }

            let errorText = '(no error output captured)';
            try {
              const errorFile = path.join(process.env.RUNNER_TEMP, 'wiki-build-error.txt');
              const captured = fs.readFileSync(errorFile, 'utf8').trim();
              if (captured) {
                errorText =
                  captured.length > maxExcerptLength
                    ? `…(truncated)\n${captured.slice(-maxExcerptLength)}`
                    : captured;
              }
            } catch (err) {
              core.warning(`Could not read wiki build error log: ${errorMessage(err)}`);
            }

            const body = [
              marker,
              `⚠️ **Wiki regeneration failed** for the release of \`${releaseBranch}\`.`,
              '',
              'The `update-wiki` job stays green (it is not a blocking stage), ' +
                'so this comment is the only notification. The regenerated ' +
                '`wiki/` was **not** committed to this PR. Please fix the ' +
                'underlying issue (e.g. commit the needed wiki changes ' +
                'manually) so the docs stay in sync with the released code.',
              '',
              `Full log: ${runUrl}`,
              '',
              '<details><summary>Build error (last lines)</summary>',
              '',
              '````text',
              errorText,
              '````',
              '',
              '</details>',
            ].join('\n');

            // A re-run must update the previous notification instead of posting
            // a duplicate comment on the human-reviewed release PR.
            let previous;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              });
              previous = comments.find((comment) => (comment.body || '').includes(marker));
            } catch (err) {
              core.warning(
                `Could not list the comments of release PR #${number}: ` +
                  `${errorMessage(err)}; posting a new comment.`,
              );
            }

            try {
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body,
                });
                core.info(`Updated the wiki build failure comment on release PR #${number}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body,
                });
                core.info(`Commented about the wiki build failure on release PR #${number}`);
              }
            } catch (err) {
              await reportFailure(
                `Could not post the wiki build failure comment on release PR #${number}: ` +
                  errorMessage(err),
              );
            }
