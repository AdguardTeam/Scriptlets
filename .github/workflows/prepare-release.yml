name: Prepare release

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag (via the
  shared create-release-pr.yml reusable workflow), then regenerates the
  auto-generated wiki/ and appends it to the PR's branch so both are reviewed
  and merged together. After merge, publish-release.yml takes over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v2.5.0, v2.5.0-beta.1)'
        required: true
        type: string

# `contents: write` — update-wiki commits/pushes the wiki to the release
#   branch with the job's GITHUB_TOKEN (same-repo push, so no Octopass
#   token/grant is needed).
# `id-token: write` — Octopass OIDC for PR creation: the shared
#   create-release-pr workflow exchanges the id-token for an App token, and a
#   reusable workflow's permissions can never exceed the caller's, so the
#   caller MUST grant id-token here (every other caller of that workflow
#   keeps both permissions for this reason).
permissions:
  contents: write
  id-token: write

jobs:
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      team: extensions
      tag: ${{ inputs.tag }}

  # Regenerate the auto-generated wiki/ from JSDoc and append it to the release
  # PR's branch after the PR is open, so the wiki update is reviewed and merged
  # TOGETHER with the release. This way released code changes and docs are
  # always in sync.
  update-wiki:
    needs: create-release-pr
    runs-on: team-extensions
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release-bump/${{ inputs.tag }}
          fetch-depth: 0

      - name: Build wiki
        id: build-wiki
        continue-on-error: true
        run: >-
          DOCKER_BUILDKIT=1 docker build --progress plain
          --target wiki-output --output ./wiki-out .

      # Only append when the wiki was actually built; a transient build failure
      # (steps.build-wiki.outcome != 'success') is skipped so we don't try to
      # mv a non-existent wiki-out/ directory. The PR still contains just the
      # CHANGELOG bump.
      - name: Append regenerated wiki
        if: steps.build-wiki.outcome == 'success'
        run: |
          rm -rf wiki
          mv wiki-out/wiki wiki
          rm -rf wiki-out

      # Commit and push the wiki to the release branch. This is a same-repo
      # push, so the job's GITHUB_TOKEN (contents: write on this repo) is
      # sufficient — an Octopass token/grant is only needed for cross-repo
      # pushes (e.g. mirrors). checkout@v5 already persisted the GITHUB_TOKEN
      # as an Authorization extraheader, so 'git push origin' authenticates
      # with it; embedding the token in the URL again would send two
      # Authorization headers and be rejected ("Duplicate header").
      - name: Commit and push wiki
        if: steps.build-wiki.outcome == 'success'
        shell: bash
        env:
          BRANCH: release-bump/${{ inputs.tag }}
        run: |
          set -euo pipefail

          # `--porcelain` covers both tracked and untracked changes in one
          # check (the old guard split this across `git diff` and `git
          # ls-files`). Nothing to commit on a no-op rebuild (no empty commits).
          if [ -z "$(git status --porcelain -- wiki)" ]
          then
            echo "Wiki is unchanged; nothing to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add wiki
          git commit -m 'docs: regenerate wiki docs for release'

          # Plain fast-forward push. We always append a commit to the branch
          # we just checked out, so if the remote moved forward the push
          # fast-forwards onto it, and if the branch was reset the push is
          # rejected as non-fast-forward — either way we never clobber.
          git push origin "HEAD:${BRANCH}"
