name: CI

description: Lints, tests, and builds on pull requests and pushes to master.

on:
  pull_request:
  push:
    branches:
      - master

# All CI runs share a single remote BuildKit instance, so Docker builds across
# different refs MUST NOT run concurrently — two `docker buildx build` calls at
# once crash the shared builder ("error reading from server: EOF").
#
# The concurrency group is PER-REF (not repo-wide) so that different PRs' CI
# runs never cancel each other.  `cancel-in-progress: false` ensures the
# in-progress run always finishes; only redundant same-ref runs are replaced
# by the newest push to that ref.
#
# Docker-build serialization across different refs is handled by the
# "Wait for previous CI runs" step at the start of the job, which polls the
# GitHub API for in-progress CI runs that started before this one and waits
# for them to finish.  This provides TRUE queueing: no run is ever cancelled,
# but Docker builds never overlap.
concurrency:
  group: ci-ext-scriptlets-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: team-extensions
    permissions:
      # Least privilege: CI only checks out and builds; it never pushes from
      # this workflow, so the default token permissions are reduced.
      contents: read
      # Needed by the "Wait for previous CI runs" step to list workflow runs
      # via the GitHub Actions API.
      actions: read
    steps:
      - name: Wait for previous CI runs to finish
        uses: actions/github-script@v7
        timeout-minutes: 15
        with:
          script: |
            // Docker builds share a single remote BuildKit instance, so only
            // one CI run can build at a time.  The per-ref concurrency group
            // prevents cross-PR cancellation but allows runs on different refs
            // to be in progress simultaneously — this step serializes the
            // actual Docker builds by waiting for earlier in-progress CI runs.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const thisRunId = context.runId;
            const POLL_INTERVAL_MS = 30_000;
            const MAX_WAIT_MS = 15 * 60_000;

            let waited = 0;
            while (waited < MAX_WAIT_MS) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  status: 'in_progress',
                  per_page: 100,
                },
              );
              const earlier = data.workflow_runs.filter(
                (r) => r.id < thisRunId,
              );
              if (earlier.length === 0) {
                core.info('No earlier in-progress CI runs. Proceeding.');
                return;
              }
              const names = earlier.map((r) => r.head_branch).join(', ');
              core.info(`Waiting for ${earlier.length} earlier CI run(s) to finish (${names})...`);
              await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));
              waited += POLL_INTERVAL_MS;
            }
            core.warning('Timed out waiting for earlier CI runs. Proceeding anyway.');

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@master

      - name: Lint
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target lint-output --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: Vitest
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-vitest-output --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: QUnit
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-qunit-output --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: Smoke tests
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-smoke-output --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: Build release artifacts
        run: >-
          DOCKER_BUILDKIT=1 docker build --progress plain
          --target build-output --output ./artifacts
          --build-arg BUILD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/scriptlets.tgz
