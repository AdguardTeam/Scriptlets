name: CI

description: Lints, tests, and builds on pull requests and pushes to master.

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same ref: a newer push (or PR update) makes the
# in-progress CI obsolete, so stop it to free runners and give faster feedback.
# The group is repo-scoped (ci-ext-scriptlets-*) to avoid collisions with other
# repositories sharing the same self-hosted runner pool.
concurrency:
  group: ci-ext-scriptlets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and all test suites run as legs of a single matrix job.
  #
  # `max-parallel: 2` is deliberate: every `docker build` here lands on the
  # same shared remote BuildKit instance ("remote-extensions"), and running
  # all four builds concurrently crashed it (all jobs failed at the same
  # instant with `rpc error ... error reading from server: EOF`). Capping
  # concurrency keeps the granular per-suite check results while limiting
  # peak load on the shared builder; the retry in the run step covers
  # transient builder disconnects caused by other consumers of the instance.
  test:
    name: ${{ matrix.name }}
    runs-on: team-extensions
    strategy:
      # A failed leg must not cancel the others — every suite's result is
      # reported separately, and the aggregate gate blocks the merge anyway.
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Initiate QUnit tests first because they are the slowest
          - name: QUnit
            target: test-qunit-output
          - name: Lint
            target: lint-output
          - name: Vitest
            target: test-vitest-output
          - name: Smoke tests
            target: test-smoke-output
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: ${{ matrix.name }} via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target "${{ matrix.target }}" . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            # Retry only when the shared remote builder dropped the
            # connection (transient infra failure). Real lint/test failures
            # exit immediately so feedback stays fast.
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

  build:
    name: Build
    runs-on: team-extensions
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Build release artifacts via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target build-output --output ./artifacts . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            # Same transient-builder retry as the test matrix above.
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/scriptlets.tgz

  # Aggregate gate. `if: always()` ensures it runs even when upstream jobs
  # fail, so it always reports a final conclusion. It fails unless EVERY job
  # succeeded — so a job that did not run at all (startup_failure, blocked
  # action) also blocks the merge. Require ONLY this check in branch protection
  # (mirrors AdGuardSoftwareLimited/actions/.github/workflows/ci.yml).
  all-tests-passed:
    name: All checks passed
    if: always()
    needs:
      - test
      - build
    runs-on: team-extensions
    steps:
      - name: Verify all jobs succeeded
        uses: actions/github-script@v8
        with:
          script: |
            // Reject anything that is not a clean "success" — this covers not
            // only failures and cancellations but also "skipped" or a missing
            // result, i.e. the case where a job did not run at all
            // (e.g. startup_failure because an action was blocked).
            const needs = ${{ toJSON(needs) }};
            const bad = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success')
              .map(([k, v]) => `  - ${k}: ${v.result ?? '(no result)'}`);
            if (bad.length > 0) {
              core.setFailed(`Jobs that did not succeed:\n${bad.join('\n')}`);
            } else {
              core.info('All required jobs passed.');
            }
