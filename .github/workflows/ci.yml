name: CI

description: Lints, tests, and builds on pull requests and pushes to master.

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same ref: a newer push (or PR update) makes the
# in-progress CI obsolete, so stop it to free runners and give faster feedback.
# The group is repo-scoped (ci-ext-scriptlets-*) to avoid collisions with other
# repositories sharing the same self-hosted runner pool.
concurrency:
  group: ci-ext-scriptlets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs run strictly one after another so only one docker build hits the shared
  # remote BuildKit instance ("remote-extensions") at a time. Concurrent builds
  # have crashed that builder in the past (`rpc error ... error reading from
  # server: EOF`).

  lint:
    name: Lint
    runs-on: team-extensions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Lint via Docker
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target lint-output .

  vitest:
    name: Vitest
    runs-on: team-extensions
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Vitest via Docker
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-vitest-output .

  qunit:
    name: QUnit
    runs-on: team-extensions
    needs:
      - vitest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: QUnit via Docker
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-qunit-output .

  smoke-tests:
    name: Smoke tests
    runs-on: team-extensions
    needs:
      - qunit
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Smoke tests via Docker
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-smoke-output .

  build:
    name: Build
    runs-on: team-extensions
    needs:
      - smoke-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Build release artifacts via Docker
        run: >-
          DOCKER_BUILDKIT=1 docker build --progress plain
          --target build-output --output ./artifacts .

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/scriptlets.tgz
