name: CI

description: Lints, tests, and builds on pull requests and pushes to master.

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same ref: a newer push (or PR update) makes the
# in-progress CI obsolete, so stop it to free runners and give faster feedback.
# The group is repo-scoped (ci-ext-scriptlets-*) to avoid collisions with other
# repositories sharing the same self-hosted runner pool.
concurrency:
  group: ci-ext-scriptlets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each test/lint suite is a separate job so that `build` can declare an
  # explicit `needs` dependency on every one of them.  When a job depends on
  # a matrix job with `fail-fast: false`, GitHub Actions may resolve the
  # dependency as soon as *any* leg succeeds rather than waiting for all —
  # splitting the matrix eliminates that ambiguity.
  #
  # The four Docker-based jobs share the same remote BuildKit instance
  # ("remote-extensions").  Running all four concurrently has crashed it in
  # the past (`rpc error ... error reading from server: EOF`).  Without a
  # matrix there is no `max-parallel` knob, but the retry in each run step
  # covers transient builder disconnects, and the staggered start times of
  # independently-scheduled jobs plus the retry back-off naturally limit
  # peak load on the shared builder.

  # QUnit first — it's the slowest suite and we want it to start as early as
  # possible.
  qunit:
    name: QUnit
    runs-on: team-extensions
    concurrency:
      group: ci-test
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: QUnit via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target test-qunit-output . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            # Retry only when the shared remote builder dropped the
            # connection (transient infra failure). Real test failures
            # exit immediately so feedback stays fast.
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

  lint:
    name: Lint
    runs-on: team-extensions
    concurrency:
      group: ci-test
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Lint via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target lint-output . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

  vitest:
    name: Vitest
    runs-on: team-extensions
    concurrency:
      group: ci-test
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Vitest via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target test-vitest-output . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

  smoke-tests:
    name: Smoke tests
    runs-on: team-extensions
    concurrency:
      group: ci-test
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Smoke tests via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target test-smoke-output . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

  build:
    name: Build
    runs-on: team-extensions
    needs:
      - qunit
      - lint
      - vitest
      - smoke-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set dev version
        uses: >-
          AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@fix/AG-54908

      - name: Build release artifacts via Docker
        run: |
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log="$(mktemp)"
            exit_code=0
            DOCKER_BUILDKIT=1 docker build --progress plain \
              --target build-output --output ./artifacts . >"${log}" 2>&1 || exit_code=$?
            cat "${log}"
            if [ "${exit_code}" -eq 0 ]; then
              exit 0
            fi
            # Same transient-builder retry as the test matrix above.
            if ! grep -qE 'error reading from server: EOF|failed to receive status|transport is closing' "${log}"; then
              exit "${exit_code}"
            fi
            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "::warning::Attempt ${attempt}/${max_attempts} lost the connection to the shared builder; retrying in 30s"
              sleep 30
            fi
          done
          exit "${exit_code}"

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/scriptlets.tgz
